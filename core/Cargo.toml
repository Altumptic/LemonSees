[workspace]
resolver = "2"
members = ["lemonsees-core", "lemonsees-wasm"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Altumptic <security@altumptic.com>"]
repository = "https://github.com/Altumptic/LemonSees"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
