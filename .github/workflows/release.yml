name: Release

# Тег v* → портативні збірки Windows/Linux + веб-архів, а також докази автентичності (Altumptic PSB §3):
#   SHA256SUMS · підпис Sigstore (cosign, keyless OIDC) · GitHub build provenance · SBOM (CycloneDX).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Critical CVEs block the release
        run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm test

  desktop:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  web:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - name: Package web bundle
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out/LemonSees-$V-web
          cp -r dist server package.json package-lock.json lemonsees.sh LemonSees.bat LICENSE README.md SECURITY.md out/LemonSees-$V-web/
          tar -C out -czf LemonSees-$V-web.tar.gz LemonSees-$V-web
      - name: SBOM (CycloneDX, production dependencies)
        run: |
          V=$(node -p "require('./package.json').version")
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --omit dev --output-format JSON --output-file LemonSees-$V-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            LemonSees-*-web.tar.gz
            LemonSees-*-sbom.cdx.json

  publish:
    needs: [desktop, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC: короткоживучий токен для Sigstore й attestations (без довгих секретів)
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: cd artifacts && sha256sum * | tee SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign checksums with Sigstore (keyless)
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          cat docs/security/RELEASE-NOTES-FOOTER.md >> notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "LemonSees $GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag || \
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
