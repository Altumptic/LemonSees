name: Feature request
description: Propose a feature that fits the product principles
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Before you write, check the [roadmap](https://github.com/Altumptic/LemonSees/blob/main/docs/ROADMAP.md) and the
        "Explicitly out of scope" section. Requests that need a cloud account, telemetry, a mandatory agent on servers or
        automatic changes to servers without the analyst's action will be declined.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: fleet
    attributes:
      label: Typical fleet size
      options:
        - 1–3 servers
        - 3–30 servers
        - 30+ servers
        - Not applicable
  - type: checkboxes
    id: principles
    attributes:
      label: Principles check
      options:
        - label: It works without installing software on the monitored servers (SSH only), or the agent is optional.
          required: true
        - label: It does not send analyst data to third parties by default.
          required: true
        - label: It does not change servers without an explicit analyst action.
          required: true
